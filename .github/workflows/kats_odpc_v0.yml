      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frozen runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run frozen automated tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python -m pytest | tee results/test_output.txt
          python -m compileall -q src tests

      - name: Download ten public parquet files inside runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/raw
          symbols=(SBIN RELIANCE HDFCBANK ICICIBANK INFY TCS BHARTIARTL TATASTEEL ITC LT)
          for symbol in "${symbols[@]}"; do
            curl --fail --location --retry 3 --retry-all-errors \
              --output "data/raw/${symbol}.parquet" \
              "https://raw.githubusercontent.com/rahulkanadia/IndianMarkets_DataBackfill/main/${symbol}.parquet"
            test -s "data/raw/${symbol}.parquet"
          done
          git ls-remote \
            https://github.com/rahulkanadia/IndianMarkets_DataBackfill.git \
            refs/heads/main | cut -f1 > data/source_commit.txt
          test -s data/source_commit.txt

      - name: Freeze manifest then execute one V0 run
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m kats_odpc.run \
            --data-dir data/raw \
            --output-dir results \
            --source-commit "$(cat data/source_commit.txt)" | tee results/run_output.txt

      - name: Record workflow provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          metadata = {
              "github_repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "input_commit": os.environ["GITHUB_SHA"],
          }
          Path("results/workflow_metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload immutable complete research artifact
        uses: actions/upload-artifact@v4
        with:
          name: kats-odpc-v0-complete-results
          path: |
            results/
            src/
            tests/
            requirements.txt
            pytest.ini
            README_KATS_ODPC_V0.md
          if-no-files-found: error
          retention-days: 90

      - name: Commit source tests manifest and small results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore requirements.txt pytest.ini README_KATS_ODPC_V0.md src tests results
          if git diff --cached --quiet; then
            echo "Frozen source and results are unchanged."
          else
            git commit -m "Add KATS-ODPC-V0 frozen backtest and results"
            git push
          fi
