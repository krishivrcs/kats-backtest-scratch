name: KATS ORB 3-stock risk variants

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/kats-orb-3stock-fresh/risk_variants.py"
      - "experiments/kats-orb-3stock-fresh/RISK_VARIANTS_SPEC.md"
      - "experiments/kats-orb-3stock-fresh/tests/test_risk_variants.py"
      - ".github/workflows/kats_orb_3stock_risk_variants.yml"

permissions:
  contents: read

concurrency:
  group: kats-orb-3stock-risk-variants
  cancel-in-progress: true

jobs:
  variants:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: python -m pip install -r experiments/kats-orb-3stock-fresh/requirements.txt
      - name: Regression tests
        run: python -m pytest -q experiments/kats-orb-3stock-fresh/tests
      - name: Download frozen option dataset
        run: |
          curl --fail --location --retry 4 --retry-all-errors \
            "https://www.kaggle.com/api/v1/datasets/download/kaalicharan9080/nse-future-and-options-data?datasetVersionNumber=2" \
            --output /tmp/nse_fno_v2.zip
      - name: Download frozen cash-underlying dataset
        run: |
          curl --fail --location --retry 4 --retry-all-errors \
            "https://github.com/voletiramu/nse-fno-1min-data/releases/download/v1.0.0/stocks_1m_csvs.zip" \
            --output /tmp/stocks_1m_csvs.zip
      - name: Verify frozen input hashes
        run: |
          echo "d190628cb8b962cad61d5b51979c42d9a8791cc9a42822dcf35ba8330c9253f0  /tmp/nse_fno_v2.zip" | sha256sum --check
          echo "20024713c455cc16b5daae91e06991d57a1acfa6a30c77bb7d5a742ee1789ab2  /tmp/stocks_1m_csvs.zip" | sha256sum --check
      - name: Execute frozen risk variants
        run: |
          set -o pipefail
          mkdir -p experiments/kats-orb-3stock-fresh/results/risk-variants
          python experiments/kats-orb-3stock-fresh/risk_variants.py \
            /tmp/nse_fno_v2.zip /tmp/stocks_1m_csvs.zip \
            --out experiments/kats-orb-3stock-fresh/results/risk-variants \
            | tee experiments/kats-orb-3stock-fresh/results/risk-variants-summary.txt
      - name: Upload risk-variant evidence only
        uses: actions/upload-artifact@v4
        with:
          name: kats-orb-3stock-risk-variants
          path: |
            experiments/kats-orb-3stock-fresh/results/risk-variants/
            experiments/kats-orb-3stock-fresh/results/risk-variants-summary.txt
          if-no-files-found: error
          retention-days: 30
