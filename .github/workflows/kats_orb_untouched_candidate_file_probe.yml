name: KATS ORB untouched candidate file probe

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/kats-orb-3stock-fresh/untouched_validation/candidate_file_probe.py"
      - ".github/workflows/kats_orb_untouched_candidate_file_probe.yml"

permissions:
  contents: read

jobs:
  file-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile immutable probe
        run: python -m py_compile experiments/kats-orb-3stock-fresh/untouched_validation/candidate_file_probe.py
      - name: Inspect candidate files and small ambiguous archives
        run: |
          set -o pipefail
          mkdir -p experiments/kats-orb-3stock-fresh/results/untouched-candidate-probe
          python experiments/kats-orb-3stock-fresh/untouched_validation/candidate_file_probe.py \
            --out experiments/kats-orb-3stock-fresh/results/untouched-candidate-probe \
            | tee experiments/kats-orb-3stock-fresh/results/untouched-candidate-probe-summary.txt
      - name: Upload file-probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: kats-orb-untouched-candidate-file-probe
          path: |
            experiments/kats-orb-3stock-fresh/results/untouched-candidate-probe/
            experiments/kats-orb-3stock-fresh/results/untouched-candidate-probe-summary.txt
          if-no-files-found: error
          retention-days: 30

